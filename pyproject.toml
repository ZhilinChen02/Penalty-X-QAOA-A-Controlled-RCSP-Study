[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qroute-dilution"
version = "0.1.0"
description = "Controlled RCSP benchmark for representation-induced feasible-space dilution in shallow QAOA"
readme = "README.md"
license = "MIT"
authors = [{name = "Zhilin Chen", email = "zwq152@alumni.ku.dk"}]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
# Optional infrastructure check only; scientific code uses NumPy on CPU.
gpu-check = ["torch>=2.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

markers = ["gpu: optional CUDA infrastructure checks; no experimental optimization"]
